<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise</title>
    <style>
        .page {
      display: flex;          
      min-height: 100vh;     
    }
    .sidebar {
      background: #1d4ed8;
      width: 220px;
      color: white;
      padding: 16px;
    }
    .main {
      flex: 1;                
      padding: 24px;
      background: #15202b;
      color: white;
    }

    table{
        border-collapse:collapse;
        width:100%;
    }
    th, td {
      text-align: left;
      padding: 8px;
      border-bottom: 1px solid #334155;
    }
   
    </style>

</head>

<body>
     <div class="page">
    <div class="sidebar">
      <h2>SpendWise</h2>
      <p>Dashboard</p>
      <p>Accounts</p>
      <p>Budgets</p>
    </div>
    <div class="main">
      <h1>Budgets</h1>

        <table>
     <thead>
        <tr>
           <th>Catgory</th>
           <th>Target Amount</th>
           <th>Target Date</th>
           <th>Progress</th>
           <th>Spent</th>
        </tr>
    </thead>
    <tbody>
         <tr>
           <td>Transport</td>
           <td>R1500</td>
           <td>30 August 2026</td>
           <td>Progress</td>
           <td>R870</td>
        </tr>
        </tbody>
        </table>
  

    </div>
  </div>


</body>
</html>
